<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenCode Go Usage</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg-body: #0a0c10;
      --bg-surface: #101316;
      --bg-elevated: #171a1e;
      --bg-hover: rgba(255,255,255,0.04);
      --line: rgba(255,255,255,0.06);
      --line-hover: rgba(255,255,255,0.10);
      --text: #e8edf5;
      --text-secondary: #8b95a8;
      --text-tertiary: #586070;
      --accent: #5b8cff;
      --accent-bg: rgba(91,140,255,0.10);
      --green: #2ecc71;
      --green-bg: rgba(46,204,113,0.10);
      --yellow: #f1c40f;
      --yellow-bg: rgba(241,196,15,0.10);
      --red: #e74c3c;
      --red-bg: rgba(231,76,60,0.10);
      --radius-sm: 8px;
      --radius: 12px;
      --radius-lg: 16px;
    }

    body {
      margin: 0;
      background: var(--bg-body);
      color: var(--text);
      font: 14px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Layout ───────────────────────────── */
    .app-wrap { max-width: 1120px; margin: 0 auto; padding: 32px 24px 48px; }

    /* ── Header ───────────────────────────── */
    .app-hdr {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 28px; gap: 16px; flex-wrap: wrap;
    }
    .app-hdr-left { display: grid; gap: 2px; }
    .app-hdr-left h1 {
      margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.03em;
      background: linear-gradient(135deg, #e8edf5 0%, #8b95a8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .app-hdr-sub { font-size: 12.5px; color: var(--text-tertiary); }
    .app-hdr-right { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    .btn {
      position: relative;
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 14px; border-radius: 999px;
      border: 1px solid var(--line); background: transparent;
      color: var(--text-secondary); font-size: 12px; font-weight: 550;
      cursor: pointer; transition: all 0.18s ease; white-space: nowrap;
      overflow: hidden; user-select: none; letter-spacing: 0.01em;
    }
    .btn:hover { color: var(--text); border-color: var(--line-hover); background: var(--bg-hover); }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, #5b8cff 0%, #4a7af0 100%);
      border-color: transparent; color: #fff; font-weight: 600;
      box-shadow: 0 1px 3px rgba(91,140,255,0.25), inset 0 1px 0 rgba(255,255,255,0.12);
    }
    .btn-primary:hover { filter: brightness(1.08); box-shadow: 0 2px 8px rgba(91,140,255,0.35), inset 0 1px 0 rgba(255,255,255,0.12); }
    .btn-primary:disabled { pointer-events: none; opacity: 0.7; }
    .btn svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* spinner */
    .btn-spinner { color: transparent !important; pointer-events: none !important; }
    .btn-spinner::after {
      content: '';
      position: absolute; width: 15px; height: 15px;
      top: 50%; left: 50%; margin: -7.5px 0 0 -7.5px;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: #fff; border-radius: 50%;
      animation: rot 0.55s linear infinite;
    }
    @keyframes rot { to { transform: rotate(360deg); } }

    /* done flash */
    .btn-done { background: var(--green) !important; border-color: transparent !important; color: #fff !important; }
    .btn-done::after { display: none; }
    @keyframes pulse-green {
      0% { box-shadow: 0 0 0 0 rgba(46,204,113,0.5); }
      70% { box-shadow: 0 0 0 10px rgba(46,204,113,0); }
      100% { box-shadow: 0 0 0 0 rgba(46,204,113,0); }
    }
    .btn-done { animation: pulse-green 0.6s ease-out; }

    .login-hint { font-size: 11.5px; color: var(--text-tertiary); margin-top: 6px; text-align: right; letter-spacing: 0.01em; }

    /* ── Top row stats ────────────────────── */
    .stats-row {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--bg-surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 18px;
      display: grid; gap: 2px;
    }
    .stat-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-tertiary); }
    .stat-value { font-size: 28px; font-weight: 750; letter-spacing: -0.03em; line-height: 1.15; }
    .stat-sub { font-size: 12px; color: var(--text-tertiary); margin-top: 1px; }

    /* ── Status bar ────────────────────────── */
    .status-bar {
      display: flex; align-items: center; gap: 12px;
      font-size: 12px; color: var(--text-tertiary);
      margin-bottom: 28px; padding-bottom: 0;
    }

    .sse-dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-tertiary); flex: none;
    }
    .sse-dot.on { background: var(--green); box-shadow: 0 0 6px rgba(46,204,113,0.4); }
    .sse-dot.off { background: var(--red); box-shadow: 0 0 6px rgba(231,76,60,0.3); }
    .sse-dot.connecting { background: var(--yellow); animation: blink 0.8s ease infinite; }
    @keyframes blink { 50% { opacity: 0.3; } }

    /* ── Accounts table ──────────────────── */
    .acct-table {
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: var(--bg-surface);
    }
    .acct-row {
      display: grid;
      grid-template-columns: 200px 120px 1fr 80px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      align-items: start; gap: 12px;
      transition: background 0.15s ease;
    }
    .acct-row:last-child { border-bottom: none; }
    .acct-row:hover { background: var(--bg-hover); }

    .acct-row-header {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--text-tertiary);
      background: rgba(255,255,255,0.02);
      padding: 10px 18px;
      border-bottom: 1px solid var(--line);
      cursor: default;
    }
    .acct-row-header:hover { background: rgba(255,255,255,0.02) !important; }

    /* row flash */
    @keyframes row-in {
      0% { background: var(--accent-bg); }
      100% { background: transparent; }
    }
    .acct-row.flash { animation: row-in 0.8s ease-out; }

    .acct-name { font-weight: 650; font-size: 13px; line-height: 1.3; word-break: break-all; }
    .acct-badge {
      display: inline-block; margin-top: 4px;
      font-size: 10.5px; font-weight: 600;
      padding: 1px 7px; border-radius: 999px;
      background: rgba(255,255,255,0.04); border: 1px solid var(--line);
      color: var(--text-secondary);
      letter-spacing: 0.01em;
    }

    /* status column */
    .acct-status { display: grid; gap: 2px; }
    .acct-status-line { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; }
    .acct-dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
    .acct-status-line.ok { color: var(--green); } .acct-dot.ok { background: var(--green); box-shadow: 0 0 5px rgba(46,204,113,0.3); }
    .acct-status-line.pending { color: var(--yellow); } .acct-dot.pending { background: var(--yellow); }
    .acct-status-line.err { color: var(--red); } .acct-dot.err { background: var(--red); }
    .acct-status-sub { font-size: 11px; color: var(--text-tertiary); }

    /* usage column */
    .acct-usage { display: grid; gap: 10px; }

    .usage-bars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .usage-bar-item {
      display: grid; gap: 4px;
      padding: 8px 10px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      min-height: 56px;
      align-content: center;
    }
    .usage-bar-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-tertiary); }
    .usage-bar-track {
      position: relative; height: 5px; border-radius: 999px;
      background: rgba(255,255,255,0.06);
      overflow: hidden;
    }
    .usage-bar-fill {
      position: absolute; left: 0; top: 0; height: 100%;
      border-radius: 999px; transition: width 0.5s ease;
    }
    .usage-bar-fill.good { background: var(--accent); }
    .usage-bar-fill.warn { background: var(--yellow); }
    .usage-bar-fill.bad { background: var(--red); }

    .usage-bar-bottom { display: flex; justify-content: space-between; font-size: 11px; }
    .usage-bar-pct { font-weight: 700; }
    .usage-bar-reset { color: var(--text-tertiary); }

    .usage-meta { display: flex; gap: 6px; flex-wrap: wrap; }
    .usage-pill {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; color: var(--text-secondary);
      padding: 2px 8px; border-radius: 999px;
      background: rgba(255,255,255,0.02); border: 1px solid var(--line);
    }
    .usage-pill strong { color: var(--text); font-weight: 600; }

    /* delete */
    .btn-del {
      font-size: 11px; font-weight: 600; padding: 5px 0;
      background: none; border: none; color: var(--text-tertiary);
      cursor: pointer; transition: color 0.15s ease;
    }
    .btn-del:hover { color: var(--red); }

    /* ── Footer ──────────────────────────── */
    .ft-status { margin-top: 10px; font-size: 12px; color: var(--text-tertiary); }
    .ft-status.err { color: var(--red); }

    /* ── No-accounts empty state ──────────── */
    .empty-state {
      text-align: center; padding: 48px 24px; color: var(--text-tertiary);
      border: 1px dashed var(--line); border-radius: var(--radius-lg);
      background: var(--bg-surface);
    }
    .empty-state strong { color: var(--text-secondary); }

    /* ── Responsive ───────────────────────── */
    @media (max-width: 820px) {
      .stats-row { grid-template-columns: 1fr 1fr; }
      .acct-row { grid-template-columns: 1fr 1fr; }
      .acct-row .acct-usage { grid-column: 1 / -1; }
      .usage-bars { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 540px) {
      .app-hdr { flex-direction: column; align-items: stretch; }
      .app-hdr-right { justify-content: flex-end; }
      .stats-row { grid-template-columns: 1fr; }
      .acct-row { grid-template-columns: 1fr; }
      .usage-bars { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div class="app-wrap">

  <!-- Header -->
  <header class="app-hdr">
    <div class="app-hdr-left">
      <h1>OpenCode Usage</h1>
      <div class="app-hdr-sub">Monitors account quotas across saved sessions</div>
    </div>
    <div class="app-hdr-right">
      <button class="btn btn-primary" id="refreshBtn"><svg viewBox="0 0 16 16"><path d="M13.5 2.5v3.5h-3.5"/><path d="M2.5 13.5v-3.5h3.5"/><path d="M13.5 6A6 6 0 0 0 4 3.5l-.5 3"/><path d="M2.5 10A6 6 0 0 0 12 12.5l.5-3"/></svg>Refresh</button>
      <button class="btn" id="addGitHubBtn"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><line x1="8" y1="5" x2="8" y2="11"/><line x1="5" y1="8" x2="11" y2="8"/></svg>GitHub</button>
      <button class="btn" id="addGoogleBtn"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><line x1="8" y1="5" x2="8" y2="11"/><line x1="5" y1="8" x2="11" y2="8"/></svg>Google</button>
      <div class="login-hint" id="loginHint">Browser opens, login saves automatically</div>
    </div>
  </header>

  <!-- Top stats -->
  <div class="stats-row" id="statsRow">
    <div class="stat-card">
      <div class="stat-label">Accounts</div>
      <div class="stat-value" id="statAccounts">—</div>
      <div class="stat-sub" id="statAccountsSub"></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Health</div>
      <div class="stat-value" id="statHealth">—</div>
      <div class="stat-sub" id="statHealthSub"></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Cost</div>
      <div class="stat-value" id="statCost">—</div>
      <div class="stat-sub" id="statCostSub"></div>
    </div>
  </div>

  <!-- Status bar -->
  <div class="status-bar">
    <span><span class="sse-dot off" id="sseDot"></span> <span id="sseLabel">Disconnected</span></span>
    <span>·</span>
    <span>Auto-scrape every 60s</span>
    <span>·</span>
    <span id="serverStatusLabel">Server: <span id="serverStatusValue">—</span></span>
    <span>·</span>
    <span id="countdownLabel">Next: <span id="countdownValue">—</span></span>
  </div>

  <!-- Accounts table -->
  <div class="acct-table" id="acctTable">
    <div class="acct-row acct-row-header">
      <span>Account</span>
      <span>Status</span>
      <span>Usage</span>
      <span></span>
    </div>
    <div id="acctRows"></div>
  </div>

  <div class="ft-status" id="ftStatus">Loading…</div>
</div>

<script>
  const _ = id => document.getElementById(id);
  const stEl = _('ftStatus');
  const statAccounts = _('statAccounts');
  const statAccountsSub = _('statAccountsSub');
  const statHealth = _('statHealth');
  const statHealthSub = _('statHealthSub');
  const statCost = _('statCost');
  const statCostSub = _('statCostSub');
  const sseDot = _('sseDot');
  const sseLabel = _('sseLabel');
  const serverStatusValue = _('serverStatusValue');
  const countdownValue = _('countdownValue');
  const acctRows = _('acctRows');
  const acctTable = _('acctTable');
  const refreshBtn = _('refreshBtn');
  const addGitHubBtn = _('addGitHubBtn');
  const addGoogleBtn = _('addGoogleBtn');
  const loginHint = _('loginHint');

  let lastScrapeAt = null;
  let serverOnline = false;
  let countdown = 60;
  let refreshTimer, countdownTimer, pollTimer, sseReconnectTimer, addStatusTimer;

  // ── Helpers ──────────────────────────────────
  function txt(v) { return v == null || v === '' ? '—' : String(v); }
  function ago(iso) {
    if (!iso) return '';
    const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 60) return `${s}s`;
    if (s < 3600) return `${Math.floor(s/60)}m`;
    if (s < 86400) return `${Math.floor(s/3600)}h`;
    return `${Math.floor(s/86400)}d`;
  }
  function pctColor(val) {
    if (val >= 90) return 'bad';
    if (val >= 70) return 'warn';
    return 'good';
  }

  // ── Button states ────────────────────────────
  function btnLoad(on) {
    if (on) { refreshBtn.classList.add('btn-spinner'); refreshBtn.disabled = true; }
    else { refreshBtn.classList.remove('btn-spinner'); refreshBtn.disabled = false; }
  }
  function btnDone() {
    refreshBtn.classList.remove('btn-spinner');
    refreshBtn.classList.add('btn-done');
    refreshBtn.innerHTML = '✓ Done';
    setTimeout(() => {
      refreshBtn.classList.remove('btn-done');
      refreshBtn.innerHTML = '<svg viewBox="0 0 16 16"><path d="M13.5 2.5v3.5h-3.5"/><path d="M2.5 13.5v-3.5h3.5"/><path d="M13.5 6A6 6 0 0 0 4 3.5l-.5 3"/><path d="M2.5 10A6 6 0 0 0 12 12.5l.5-3"/></svg>Refresh';
    }, 1300);
  }

  // ── Stats ────────────────────────────────────
  function renderStats(accounts) {
    const n = accounts.length;
    const ok = accounts.filter(a => !a.error).length;
    const errs = n - ok;
    const sumCost = accounts.reduce((s, a) => s + (parseFloat(a.totalCost)||0), 0);
    const latest = accounts.map(a => a.scrapedAt).filter(Boolean).sort().reverse()[0];
    const gs = accounts.filter(a => String(a.provider||'github').toLowerCase() === 'github').length;
    const gl = n - gs;

    statAccounts.textContent = n;
    statAccountsSub.textContent = `${gs} GitHub · ${gl} Google` + (latest ? ` · updated ${ago(latest)} ago` : '');

    if (errs) {
      statHealth.textContent = `${ok}/${n}`;
      statHealthSub.textContent = `${errs} error${errs>1?'s':''}`;
      statHealth.style.color = 'var(--red)';
    } else {
      statHealth.textContent = `${ok}/${n}`;
      statHealthSub.textContent = 'All good';
      statHealth.style.color = 'var(--green)';
    }

    statCost.textContent = `$${sumCost.toFixed(2)}`;
    statCostSub.textContent = `${accounts.filter(a => a.totalCost).length} accounts with costs`;
  }

  // ── Usage bars ──────────────────────────────
  function renderUsage(account) {
    const limits = Array.isArray(account.goLimits) ? account.goLimits : [];
    if (!limits.length) return '<span style="color:var(--text-tertiary);font-size:12px">No usage data</span>';

    return `<div class="usage-bars">${limits.map(l => {
      const pct = Number.parseFloat(String(l.percentValue ?? l.percentage ?? '0')) || 0;
      const color = pctColor(pct);
      return `
        <div class="usage-bar-item">
          <div class="usage-bar-label">${txt(l.label).replace(' Usage','')}</div>
          <div class="usage-bar-track">
            <div class="usage-bar-fill ${color}" style="width:${Math.min(pct,100)}%"></div>
          </div>
          <div class="usage-bar-bottom">
            <span class="usage-bar-pct">${txt(l.percentage)}</span>
            <span class="usage-bar-reset">${txt(l.reset).replace(/^resets?\s+in\s+/i,'')}</span>
          </div>
        </div>`;
    }).join('')}</div>`;
  }

  // ── Status cell ─────────────────────────────
  function statusHtml(a) {
    if (a.error) return `<div class="acct-status"><div class="acct-status-line err"><span class="acct-dot err"></span>Error</div><div class="acct-status-sub">${txt(a.error)}</div></div>`;
    if (!a.scrapedAt) return `<div class="acct-status"><div class="acct-status-line pending"><span class="acct-dot pending"></span>Pending</div><div class="acct-status-sub">waiting for sync</div></div>`;
    return `<div class="acct-status"><div class="acct-status-line ok"><span class="acct-dot ok"></span>OK</div><div class="acct-status-sub">${ago(a.scrapedAt)} ago</div></div>`;
  }

  // ── Render rows ─────────────────────────────
  function renderRows(accounts) {
    const hasPrev = acctRows.children.length > 0;
    acctRows.innerHTML = accounts.map(a => {
      const p = String(a.provider||'github').toLowerCase() === 'google' ? 'Google' : 'GitHub';
      const cost = a.totalCost != null ? `$${Number.parseFloat(a.totalCost).toFixed(4)}` : '—';
      return `
        <div class="acct-row" data-account="${txt(a.name)}">
          <div>
            <div class="acct-name">${txt(a.name)}</div>
            <span class="acct-badge">${p}</span>
          </div>
          <div>${statusHtml(a)}</div>
          <div class="acct-usage">
            ${renderUsage(a)}
            <div class="usage-meta">
              <span class="usage-pill">Cost <strong>${cost}</strong></span>
            </div>
          </div>
          <div><button class="btn-del" data-del="${txt(a.name)}">Delete</button></div>
        </div>`;
    }).join('');

    if (hasPrev) {
      acctRows.querySelectorAll('.acct-row').forEach(el => {
        el.classList.add('flash');
        setTimeout(() => el.classList.remove('flash'), 900);
      });
    }

    acctRows.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('click', () => delAccount(btn.dataset.del));
    });
  }

  // ── SSE ──────────────────────────────────────
  function connectSSE() {
    if (sseReconnectTimer) { clearTimeout(sseReconnectTimer); sseReconnectTimer = null; }
    sseDot.className = 'sse-dot connecting';
    sseLabel.textContent = 'Connecting';

    const es = new EventSource('/api/events');
    es.addEventListener('open', () => {
      sseDot.className = 'sse-dot on';
      sseLabel.textContent = 'Live';
    });
    es.addEventListener('server-state', e => {
      try {
        const s = JSON.parse(e.data);
        serverStatusValue.textContent = s.autoScrapeRunning ? 'running' : 'idle';
      } catch {}
    });
    es.addEventListener('scrape-complete', () => {
      loadAccounts();
      btnDone();
    });
    es.addEventListener('add-complete', () => { loadAccounts(); });
    es.onerror = () => {
      sseDot.className = 'sse-dot connecting';
      sseLabel.textContent = 'Reconnecting';
      es.close();
      sseReconnectTimer = setTimeout(connectSSE, 1500);
      loadStatus();
    };
  }

  // ── State polling ───────────────────────────
  async function loadStatus() {
    try {
      const r = await fetch('/api/status?ts='+Date.now());
      const s = await r.json();
      if (!serverOnline) {
        serverOnline = true;
        if (!sseDot.className.includes('on')) connectSSE();
        loadAccounts();
      }
      serverStatusValue.textContent = s.autoScrapeRunning ? 'running' : 'idle';
      if (s.lastAutoScrapeAt && s.lastAutoScrapeAt !== lastScrapeAt) {
        lastScrapeAt = s.lastAutoScrapeAt;
        loadAccounts();
      }
    } catch {
      serverOnline = false;
      serverStatusValue.textContent = 'offline';
    }
  }

  async function loadAddStatus() {
    try {
      const r = await fetch('/api/add-status?ts='+Date.now());
      const s = await r.json();
      if (s.status === 'done') { loginHint.textContent = 'Login complete.'; }
      else if (s.status === 'opening') { loginHint.textContent = `Opening browser: ${s.name||'—'}`; }
      else if (s.status === 'logging_in') { loginHint.textContent = `Waiting for login: ${s.name||'—'}`; }
      else if (s.status === 'error') { loginHint.textContent = `Error: ${s.error||'Failed'}`; }
      else { loginHint.textContent = 'Browser opens, login saves automatically'; }
    } catch { loginHint.textContent = 'Offline'; }
  }

  async function pollAddDone() {
    if (addStatusTimer) clearInterval(addStatusTimer);
    await loadAddStatus();
    addStatusTimer = setInterval(async () => {
      await loadAddStatus();
      try {
        const r = await fetch('/api/add-status?ts='+Date.now());
        const s = await r.json();
        if (['done','error','idle'].includes(s.status)) {
          clearInterval(addStatusTimer); addStatusTimer = null;
          refreshAll();
        }
      } catch {}
    }, 3000);
  }

  // ── API actions ─────────────────────────────
  async function loadAccounts() {
    stEl.textContent = 'Loading…';
    try {
      const r = await fetch('/api/accounts?ts='+Date.now());
      const a = await r.json();
      renderStats(a); renderRows(a);
      stEl.textContent = `${a.length} account${a.length!==1?'s':''} loaded.`;
    } catch (e) { stEl.innerHTML = `<span class="err">Failed: ${e.message}</span>`; }
  }

  async function delAccount(name) {
    if (!confirm(`Delete "${name}" and all its data?`)) return;
    stEl.textContent = `Deleting ${name}…`;
    const r = await fetch(`/api/accounts/${encodeURIComponent(name)}`,{method:'DELETE'});
    const p = await r.json();
    if (p.ok) { stEl.textContent = `Deleted ${name}.`; loadAccounts(); }
    else { stEl.innerHTML = `<span class="err">${p.error||'Failed'}</span>`; }
  }

  async function refreshAll() {
    btnLoad(true);
    try { await Promise.all([loadAccounts(), loadStatus()]); }
    finally { btnLoad(false); }
  }

  async function scrapeAll() {
    btnLoad(true);
    stEl.textContent = 'Refreshing all accounts…';
    try {
      const r = await fetch('/api/refresh?ts='+Date.now(),{method:'POST'});
      const p = await r.json();
      if (p.results) { renderStats(p.results); renderRows(p.results); }
      stEl.textContent = p.results ? `Done. ${p.count} accounts.` : `Error: ${p.error||'Unknown'}`;
      loadStatus();
    } catch (e) { stEl.innerHTML = `<span class="err">${e.message}</span>`; }
    finally { btnLoad(false); btnDone(); }
  }

  async function startAdd(provider) {
    const name = prompt(`Enter ${provider} account name:`);
    if (!name) return;
    loginHint.textContent = `Starting ${provider} login: ${name}`;
    const r = await fetch(`/api/add-account/${encodeURIComponent(name)}`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({provider})
    });
    const p = await r.json();
    if (!r.ok) { loginHint.textContent = p.error||'Failed'; return; }
    pollAddDone();
    loadAccounts();
  }

  // ── Timers ──────────────────────────────────
  function startTimers() {
    if (refreshTimer) clearInterval(refreshTimer);
    if (countdownTimer) clearInterval(countdownTimer);
    if (pollTimer) clearInterval(pollTimer);
    countdown = 60;
    countdownValue.textContent = `${countdown}s`;
    refreshTimer = setInterval(() => { refreshAll(); countdown=60; }, 60000);
    countdownTimer = setInterval(() => { countdown = Math.max(0,countdown-1); countdownValue.textContent = `${countdown}s`; }, 1000);
    pollTimer = setInterval(loadStatus, 5000);
  }

  // ── Init ────────────────────────────────────
  refreshBtn.addEventListener('click', scrapeAll);
  addGitHubBtn.addEventListener('click', () => startAdd('github'));
  addGoogleBtn.addEventListener('click', () => startAdd('google'));
  refreshAll(); loadAddStatus(); startTimers(); connectSSE();
</script>
</body>
</html>
