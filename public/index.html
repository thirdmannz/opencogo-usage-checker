<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenCode Go Usage Dashboard</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #121822;
      --panel-2: #171f2b;
      --line: rgba(255,255,255,0.07);
      --text: #e7eef8;
      --muted: #8fa3bc;
      --accent: #5b8cff;
      --accent-dim: rgba(91,140,255,0.12);
      --good: #35c759;
      --warn: #ffb020;
      --bad: #ff6b6b;
      --radius: 14px;
      --radius-sm: 10px;
      --radius-xs: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 13.5px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 1160px; margin: 0 auto; padding: 28px 24px; }

    /* ── Header ─────────────────────── */
    .top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; margin-bottom: 20px;
    }
    h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
    .sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; opacity: 0.7; }
    .btns { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
      padding: 8px 14px; border-radius: var(--radius-sm); cursor: pointer;
      font-weight: 600; font-size: 13px; transition: all 0.18s ease;
    }
    button:hover { filter: brightness(1.12); border-color: rgba(255,255,255,0.14); }
    button:active { transform: scale(0.97); }
    button.primary {
      background: var(--accent); border-color: transparent; color: white;
      position: relative; overflow: hidden;
    }
    button.primary:hover { filter: brightness(1.1); }
    button.primary:disabled { pointer-events: none; }

    /* Refresh button loading state */
    .refresh-loading {
      color: transparent !important;
      pointer-events: none !important;
    }
    .refresh-loading::after {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      top: 50%; left: 50%;
      margin: -8px 0 0 -8px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Pulse ring on button after completion */
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(53,199,89,0.5); }
      70% { box-shadow: 0 0 0 8px rgba(53,199,89,0); }
      100% { box-shadow: 0 0 0 0 rgba(53,199,89,0); }
    }
    .refresh-done {
      animation: pulse-ring 0.6s ease-out;
      background: var(--good) !important;
    }

    /* ── Cards ──────────────────────── */
    .grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px;
      margin: 14px 0 18px;
    }
    .card {
      background: rgba(18, 24, 34, 0.85);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 16px;
      transition: border-color 0.2s ease;
    }
    .card:hover { border-color: rgba(255,255,255,0.12); }
    .card h3 {
      margin: 0 0 8px; font-size: 12px; font-weight: 600;
      color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em;
    }
    .big { font-size: 26px; font-weight: 800; margin: 4px 0 6px; letter-spacing: -0.03em; line-height: 1.1; }

    /* ── Status cards row ────────────── */
    .status-row {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px; margin-top: 2px;
    }
    .status-card { padding: 12px 14px; }
    .status-card h3 { margin-bottom: 6px; font-size: 11px; }
    .status-card .big { font-size: 20px; margin: 2px 0 4px; }

    /* ── Table ──────────────────────── */
    .tableWrap {
      overflow: auto; border: 1px solid var(--line);
      border-radius: var(--radius); background: rgba(18,24,34,0.85);
    }
    table { width: 100%; border-collapse: collapse; min-width: 720px; }
    th, td {
      padding: 11px 14px; border-bottom: 1px solid var(--line);
      text-align: left; vertical-align: middle;
    }
    th {
      position: sticky; top: 0; background: #12192a; z-index: 1;
      color: var(--muted); font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    tr { transition: background 0.15s ease; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    /* Row flash on data update */
    @keyframes row-flash {
      0% { background: rgba(91,140,255,0.08); }
      100% { background: transparent; }
    }
    .row-updated td { animation: row-flash 0.8s ease-out; }

    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { color: var(--muted); }
    .right { text-align: right; }
    .small { font-size: 11.5px; }

    .delBtn {
      background: rgba(255,107,107,0.08); color: #ff9a9a;
      border: 1px solid rgba(255,107,107,0.18);
      padding: 4px 10px; border-radius: var(--radius-xs); cursor: pointer;
      font-size: 11.5px; font-weight: 600; transition: all 0.15s ease;
    }
    .delBtn:hover { background: rgba(255,107,107,0.22); border-color: rgba(255,107,107,0.35); }
    .delBtn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ── Status cell ───────────────── */
    .statusCell { display: grid; gap: 3px; }
    .statusLine { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; }
    .statusDot { width: 7px; height: 7px; border-radius: 999px; background: currentColor; flex: none; }
    .status-good { color: var(--good); }
    .status-warn { color: var(--warn); }
    .status-bad { color: var(--bad); }

    /* ── Usage cards ────────────────── */
    .usageGrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .usageCard {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: rgba(255,255,255,0.015);
      min-height: 68px;
      display: grid; place-items: center;
      padding: 10px;
      transition: border-color 0.2s ease;
    }
    .usageCard:hover { border-color: rgba(255,255,255,0.14); }
    .usageValue { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
    .usageLabel { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
    .usageReset { font-size: 10.5px; color: var(--muted); opacity: 0.7; }

    /* ── Pills ──────────────────────── */
    .providerBadge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 8px; border-radius: 999px;
      background: rgba(255,255,255,0.05); border: 1px solid var(--line);
      color: var(--muted); font-size: 11px; font-weight: 600;
    }
    .summaryPills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .summaryPill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 5px 9px; border-radius: 999px;
      background: rgba(255,255,255,0.03); border: 1px solid var(--line);
      color: var(--muted); font-size: 11.5px; font-weight: 500; white-space: nowrap;
    }
    .summaryPill strong { color: var(--text); font-weight: 600; }

    /* ── SSE badge ──────────────────── */
    .sse-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 8px; border-radius: 999px;
      background: rgba(255,255,255,0.03); border: 1px solid var(--line);
      color: var(--muted); font-size: 10.5px; font-weight: 600; vertical-align: middle;
    }
    .sse-badge .dot { width: 5px; height: 5px; border-radius: 999px; background: currentColor; }
    .sse-badge.connected { color: var(--good); border-color: rgba(53,199,89,0.25); }
    .sse-badge.disconnected { color: var(--bad); border-color: rgba(255,107,107,0.25); }

    /* ── Footer status ──────────────── */
    .status { margin-top: 10px; color: var(--muted); font-size: 12px; }
    .err { color: var(--bad); }

    /* ── Skeleton loading ───────────── */
    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.03) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s ease-in-out infinite;
      border-radius: 6px;
      min-height: 14px;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @media (max-width: 760px) {
      .usageGrid { grid-template-columns: 1fr; }
      .top { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="wrap">
  <div class="top">
    <div>
      <h1>OpenCode Go Usage</h1>
      <div class="sub">Scrape every 60s · push via SSE · dashboard auto-updates</div>
    </div>
    <div>
      <div class="btns">
        <button class="primary" id="refreshBtn">↻ Refresh all</button>
        <button id="addGitHubBtn">+ GitHub</button>
        <button id="addGoogleBtn">+ Google</button>
      </div>
      <div class="sub" id="loginHint">A new browser opens, login saves automatically.</div>
    </div>
  </div>

  <div class="grid" id="summary"></div>
  <div class="status" id="autoStatus">
    Auto refresh: every 60s · <span class="sse-badge disconnected" id="sseBadge"><span class="dot"></span>Live: off</span>
  </div>

  <div class="status-row" id="infoCards">
    <div class="card status-card"><h3>Next check</h3><div class="big" id="countdown">60s</div><div class="sub">Auto refresh timer</div></div>
    <div class="card status-card"><h3>Server</h3><div class="big" id="serverState">—</div><div class="sub">From /api/status</div></div>
    <div class="card status-card"><h3>Login</h3><div class="big" id="addState">—</div><div class="sub" id="addStateSub">Idle</div></div>
  </div>

  <div class="tableWrap">
    <table>
      <thead>
        <tr>
          <th>Account</th>
          <th>Status</th>
          <th>Usage</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="status" id="status">Loading…</div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const statusEl = $('status');
    const autoStatusEl = $('autoStatus');
    const countdownEl = $('countdown');
    const serverStateEl = $('serverState');
    const rowsEl = $('rows');
    const summaryEl = $('summary');
    const refreshBtn = $('refreshBtn');
    const addGitHubBtn = $('addGitHubBtn');
    const addGoogleBtn = $('addGoogleBtn');
    const addStateEl = $('addState');
    const addStateSubEl = $('addStateSub');
    const loginHintEl = $('loginHint');
    const sseBadge = $('sseBadge');

    let addStatusTimer = null;
    let lastServerScrapeAt = null;
    let lastServerSeen = false;

    const intervalMs = 60000;
    let countdown = intervalMs / 1000;
    let refreshTimer, countdownTimer, serverPollTimer, sseReconnectTimer;

    // ── Helpers ────────────────────────────────────────────────
    function safeText(v) { return v == null || v === '' ? '—' : String(v); }
    function providerLabel(p, name = '') {
      if (/@(gmail|googlemail)\.com$/.test(String(name).toLowerCase())) return 'Google';
      return String(p || '').toLowerCase() === 'google' ? 'Google' : 'GitHub';
    }
    function fmtMoney(amt, d = 4) {
      const v = Number.parseFloat(amt);
      if (!Number.isFinite(v)) return `$0.${'0'.repeat(d)}`;
      return `$${v.toFixed(d)}`;
    }
    function ago(iso) {
      if (!iso) return '';
      const s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
      if (s < 60) return `${s}s ago`;
      if (s < 3600) return `${Math.floor(s / 60)}m ago`;
      if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
      return `${Math.floor(s / 86400)}d ago`;
    }

    // ── Render ─────────────────────────────────────────────────
    function renderSummary(accounts) {
      const n = accounts.length;
      const ok = accounts.filter(a => !a.error).length;
      const errs = n - ok;
      const sumCost = accounts.reduce((s, a) => s + (parseFloat(a.totalCost) || 0), 0);
      const latest = accounts.map(a => a.scrapedAt).filter(Boolean).sort().reverse()[0];
      const providers = {};
      accounts.forEach(a => { const k = String(a.provider || 'github').toLowerCase(); providers[k] = (providers[k] || 0) + 1; });

      summaryEl.innerHTML = `
        <div class="card">
          <h3>Accounts</h3>
          <div class="big">${n}</div>
          <div class="summaryPills">
            <span class="summaryPill"><strong>${providers.github || 0}</strong> GitHub</span>
            <span class="summaryPill"><strong>${providers.google || 0}</strong> Google</span>
            ${latest ? `<span class="summaryPill">Updated <strong>${ago(latest)}</strong></span>` : ''}
          </div>
        </div>
        <div class="card">
          <h3>Health</h3>
          <div class="big" style="color:${errs ? 'var(--bad)' : 'var(--good)'}">${ok}/${n}</div>
          <div class="summaryPills">
            ${errs ? `<span class="summaryPill" style="color:var(--bad)"><strong>${errs}</strong> error</span>` : '<span class="summaryPill" style="color:var(--good)">All OK</span>'}
          </div>
        </div>
        <div class="card">
          <h3>Total Cost</h3>
          <div class="big">$${sumCost.toFixed(2)}</div>
          <div class="summaryPills">
            <span class="summaryPill">From <strong>${accounts.filter(a => a.totalCost).length}</strong> accounts</span>
          </div>
        </div>
      `;
    }

    function renderUsageLimits(a) {
      const limits = Array.isArray(a.goLimits) ? a.goLimits : [];
      if (!limits.length) return '<span class="muted small">No usage data</span>';
      return `<div class="usageGrid">${limits.map(l => {
        const pct = Number.parseFloat(String(l.percentValue ?? l.percentage ?? '0')) || 0;
        const color = pct >= 90 ? 'var(--bad)' : pct >= 70 ? 'var(--warn)' : 'var(--accent)';
        return `
          <div class="usageCard">
            <div class="usageLabel">${safeText(l.label).replace(' Usage', '')}</div>
            <div class="usageValue" style="color:${color}">${safeText(l.percentage)}</div>
            <div class="usageReset">${safeText(l.reset || '')}</div>
          </div>`;
      }).join('')}</div>`;
    }

    function statusMarkup(a) {
      if (a.error)
        return `<div class="statusCell"><div class="statusLine status-bad"><span class="statusDot"></span>Error</div><div class="small muted">${safeText(a.error)}</div></div>`;
      if (!a.scrapedAt)
        return `<div class="statusCell"><div class="statusLine status-warn"><span class="statusDot"></span>Pending</div><div class="small muted">Waiting for sync</div></div>`;
      return `<div class="statusCell"><div class="statusLine status-good"><span class="statusDot"></span>OK</div><div class="small muted">${ago(a.scrapedAt)}</div></div>`;
    }

    function renderRows(accounts) {
      const hadAccounts = rowsEl.children.length > 0;
      rowsEl.innerHTML = accounts.map(a => {
        const p = providerLabel(a.provider, a.name);
        const cost = a.totalCost != null ? fmtMoney(a.totalCost, 4) : '—';
        return `
          <tr data-account="${safeText(a.name)}">
            <td>
              <div style="font-weight:600">${safeText(a.name)}</div>
              <span class="providerBadge">${p}</span>
            </td>
            <td>${statusMarkup(a)}</td>
            <td>
              ${renderUsageLimits(a)}
              <div class="summaryPills">
                <span class="summaryPill">Total cost <strong>${cost}</strong></span>
              </div>
            </td>
            <td><button class="delBtn" data-delete-name="${safeText(a.name)}">Delete</button></td>
          </tr>`;
      }).join('');

      // Flash updated rows
      if (hadAccounts) {
        rowsEl.querySelectorAll('tr').forEach(tr => {
          tr.classList.add('row-updated');
          setTimeout(() => tr.classList.remove('row-updated'), 900);
        });
      }

      rowsEl.querySelectorAll('[data-delete-name]').forEach(btn => {
        btn.addEventListener('click', () => deleteAccount(btn.dataset.deleteName));
      });
    }

    // ── Refresh button states ──────────────────────────────────
    function setRefreshLoading(on) {
      if (on) {
        refreshBtn.classList.add('refresh-loading');
        refreshBtn.disabled = true;
      } else {
        refreshBtn.classList.remove('refresh-loading');
        refreshBtn.disabled = false;
      }
    }
    function flashRefreshDone() {
      refreshBtn.classList.add('refresh-done');
      refreshBtn.innerHTML = '✓ Done';
      setTimeout(() => {
        refreshBtn.classList.remove('refresh-done');
        refreshBtn.innerHTML = '↻ Refresh all';
      }, 1200);
    }

    // ── SSE ────────────────────────────────────────────────────
    function connectSSE() {
      if (sseReconnectTimer) { clearTimeout(sseReconnectTimer); sseReconnectTimer = null; }
      sseBadge.className = 'sse-badge disconnected';
      sseBadge.innerHTML = '<span class="dot"></span>Live: connecting';

      const es = new EventSource('/api/events');
      es.addEventListener('open', () => {
        sseBadge.className = 'sse-badge connected';
        sseBadge.innerHTML = '<span class="dot"></span>Live: on';
      });
      es.addEventListener('server-state', (e) => {
        try {
          const st = JSON.parse(e.data);
          serverStateEl.textContent = st.autoScrapeRunning ? 'Running' : 'Idle';
        } catch {}
      });
      es.addEventListener('scrape-complete', () => {
        loadAccounts();
        flashRefreshDone();
      });
      es.addEventListener('add-complete', () => { loadAccounts(); });
      es.onerror = () => {
        sseBadge.className = 'sse-badge disconnected';
        sseBadge.innerHTML = '<span class="dot"></span>Live: reconnecting';
        es.close();
        sseReconnectTimer = setTimeout(connectSSE, 1500);
        loadStatus();
      };
    }

    // ── Polling ────────────────────────────────────────────────
    async function loadStatus() {
      try {
        const r = await fetch('/api/status?ts=' + Date.now());
        const s = await r.json();
        if (!lastServerSeen) {
          lastServerSeen = true;
          if (!sseBadge.className.includes('connected')) connectSSE();
          await loadAccounts();
        }
        serverStateEl.textContent = s.autoScrapeRunning ? 'Running' : 'Idle';
        if (s.lastAutoScrapeAt && s.lastAutoScrapeAt !== lastServerScrapeAt) {
          lastServerScrapeAt = s.lastAutoScrapeAt;
          loadAccounts();
        }
      } catch {
        lastServerSeen = false;
        serverStateEl.textContent = 'Offline';
      }
    }

    async function loadAddStatus() {
      try {
        const r = await fetch('/api/add-status?ts=' + Date.now());
        const s = await r.json();
        const map = { idle: 'Idle', opening: `Opening: ${s.name||'—'}`, logging_in: `Login: ${s.name||'—'}`, saving: `Saving: ${s.name||'—'}`, done: `Done: ${s.name||'—'}`, error: s.error || 'Failed' };
        addStateEl.textContent = s.status || 'idle';
        addStateSubEl.textContent = map[s.status] || s.name || '—';
      } catch {
        addStateEl.textContent = 'Offline';
        addStateSubEl.textContent = '—';
      }
    }

    async function pollAddStatusUntilDone() {
      if (addStatusTimer) clearInterval(addStatusTimer);
      await loadAddStatus();
      addStatusTimer = setInterval(async () => {
        await loadAddStatus();
        try {
          const r = await fetch('/api/add-status?ts=' + Date.now());
          const s = await r.json();
          if (['done','error','idle'].includes(s.status)) {
            clearInterval(addStatusTimer); addStatusTimer = null;
            loginHintEl.textContent = 'A new browser opens, login saves automatically.';
            refreshAll();
          }
        } catch {}
      }, 3000);
    }

    async function startAddAccount(provider) {
      const name = prompt(`Enter ${provider} account name (e.g. ${provider}-1)`);
      if (!name) return;
      loginHintEl.textContent = `Login: ${name} (${provider}). Complete in the browser.`;
      addStateEl.textContent = 'opening';
      addStateSubEl.textContent = `Starting: ${name}`;
      const r = await fetch(`/api/add-account/${encodeURIComponent(name)}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ provider })
      });
      const p = await r.json();
      if (!r.ok) { addStateSubEl.textContent = p.error || 'Failed'; return; }
      await pollAddStatusUntilDone();
      loadAccounts();
    }

    async function loadAccounts() {
      statusEl.textContent = 'Loading…';
      try {
        const r = await fetch('/api/accounts?ts=' + Date.now());
        const a = await r.json();
        renderSummary(a); renderRows(a);
        statusEl.textContent = `${a.length} accounts loaded.`;
      } catch (e) {
        statusEl.innerHTML = `<span class="err">Load failed:</span> ${e.message}`;
      }
    }

    async function deleteAccount(name) {
      if (!confirm(`Delete "${name}"? This removes all session data.`)) return;
      statusEl.textContent = `Deleting ${name}…`;
      const r = await fetch(`/api/accounts/${encodeURIComponent(name)}`, { method: 'DELETE' });
      const p = await r.json();
      if (p.ok) { statusEl.textContent = `Deleted: ${name}`; loadAccounts(); }
      else { statusEl.innerHTML = `<span class="err">${p.error || 'Failed'}</span>`; }
    }

    async function refreshAll() {
      setRefreshLoading(true);
      try { await Promise.all([loadAccounts(), loadStatus()]); } finally { setRefreshLoading(false); }
    }

    async function scrapeAll() {
      setRefreshLoading(true);
      statusEl.textContent = 'Refreshing… opening browsers for each account.';
      try {
        const r = await fetch('/api/refresh?ts=' + Date.now(), { method: 'POST' });
        const p = await r.json();
        if (p.results) { renderSummary(p.results); renderRows(p.results); }
        statusEl.textContent = p.results ? `Done. ${p.count} accounts updated.` : `Error: ${p.error}`;
        loadStatus();
      } catch (e) { statusEl.innerHTML = `<span class="err">Failed:</span> ${e.message}`; }
      finally { setRefreshLoading(false); flashRefreshDone(); }
    }

    function startTimers() {
      if (refreshTimer) clearInterval(refreshTimer);
      if (countdownTimer) clearInterval(countdownTimer);
      if (serverPollTimer) clearInterval(serverPollTimer);
      countdown = intervalMs / 1000;
      countdownEl.textContent = `${countdown}s`;
      refreshTimer = setInterval(() => { refreshAll(); countdown = intervalMs / 1000; }, intervalMs);
      countdownTimer = setInterval(() => { countdown = Math.max(0, countdown - 1); countdownEl.textContent = `${countdown}s`; }, 1000);
      serverPollTimer = setInterval(loadStatus, 5000);
    }

    refreshBtn.addEventListener('click', scrapeAll);
    addGitHubBtn.addEventListener('click', () => void startAddAccount('github'));
    addGoogleBtn.addEventListener('click', () => void startAddAccount('google'));
    refreshAll(); loadAddStatus(); startTimers(); connectSSE();
  </script>
